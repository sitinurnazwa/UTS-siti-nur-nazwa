<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #fff; border-bottom: 1px solid #ddd; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-box { width: 30px; height: 30px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        nav a { margin-left: 15px; text-decoration: none; color: #333; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 450px; margin: 60px auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 4px; }
        form { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        form div { display: flex; flex-direction: column; gap: 5px; }
        input[type="text"], input[type="password"] { padding: 8px; border: 1px solid #aaa; border-radius: 3px; width: 100%; box-sizing: border-box; }
        .btn-container { display: flex; justify-content: flex-start; gap: 10px; margin-top: 10px; }
        button, .btn { padding: 6px 20px; background-color: #f0f0f0; border: 1px solid #888; border-radius: 3px; cursor: pointer; text-decoration: none; color: #333; font-size: 14px; text-align: center; }
        button:hover, .btn:hover { background-color: #e0e0e0; }
        footer { display: flex; justify-content: space-between; padding: 15px 30px; background-color: #fff; border-top: 1px solid #ddd; font-size: 12px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; }
        .footer-links { display: flex; gap: 15px; }
        .footer-links a { text-decoration: none; color: #333; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-box">X</div>
            <span>Nama Website</span>
        </div>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="login.html">Login</a>
            <a href="daftar.html">Daftar</a>
        </nav>
    </header>

    <main>
        <fieldset style="border: 1px solid #ccc; padding: 20px; border-radius: 4px;">
            <legend style="padding: 0 10px; font-weight: bold;">Login</legend>
            <form action="profil.html">
                <div>
                    <label>Username</label>
                    <input type="text" required>
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" required>
                </div>
                <div>
                    <label style="font-size: 13px;"><input type="checkbox"> Remember me</label>
                </div>
                <div class="btn-container">
                    <button type="submit">Login</button>
                    <a href="index.html" class="btn">Kembali</a>
                </div>
            </form>
        </fieldset>
    </main>

    <footer>
        <div>&copy; 2026 Siti Nur Nazwa - 2557401013 - Kelas MI 25</div>
        <div class="footer-links">
            <a href="#">Instagram</a>
            <a href="#">Email</a>
        </div>
    </footer>

</body>
</html>
